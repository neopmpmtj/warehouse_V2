<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Company Voice — CentCompras</title>
    <link rel="stylesheet" href="{% static 'company_voice/css/feed.css' %}">
    <link rel="stylesheet" href="{% static 'products/css/settings_menu.css' %}?v=4">
</head>
<body>
    <header class="page-header">
        <div class="header-left">
            <a href="{{ home_url }}" class="brand">CentCompras</a>
            <h1 data-i18n="title">Company Voice</h1>
        </div>
        <div class="header-right">
            {% include "products/includes/account_settings.html" %}
        </div>
    </header>

    <main class="feed-layout">
        <section class="compose-panel">
            <select id="compose-tag" aria-label="Tag">
                <option value="" data-i18n="tagNone">No tag</option>
                <option value="praise" data-i18n="tagPraise">Praise</option>
                <option value="concern" data-i18n="tagConcern">Concern</option>
                <option value="suggestion" data-i18n="tagSuggestion">Suggestion</option>
                <option value="wish" data-i18n="tagWish">Wish</option>
            </select>
            <textarea id="compose-body" rows="3" data-i18n-placeholder="composePlaceholder" placeholder="Share a thought…"></textarea>
            <div class="compose-actions">
                <label class="checkbox-label">
                    <input type="checkbox" id="compose-anonymous">
                    <span data-i18n="postAnonymous">Post anonymously</span>
                </label>
                <div class="compose-buttons">
                    <button type="button" id="feed-refresh" class="btn-link" data-i18n="refresh">Refresh</button>
                    <button type="button" id="compose-submit" class="btn-primary" data-i18n="post">Post</button>
                </div>
            </div>
        </section>

        <section id="feed" class="feed-panel" aria-live="polite"></section>
        <p id="feed-empty" class="feed-empty hidden" data-i18n="feedEmpty">No posts yet. Be the first to share.</p>
        <div id="banner" class="banner hidden" role="alert"></div>
    </main>

    <script src="{% static 'company_voice/js/feed_i18n.js' %}?v=2"></script>
    <script src="{% static 'products/js/console_settings_menu.js' %}?v=3"></script>
    <script src="{% static 'company_voice/js/feed.js' %}?v=3"></script>
</body>
</html>
