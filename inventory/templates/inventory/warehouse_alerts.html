{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Alerts — CentCompras</title>
    <script>
        (function () {
            var theme = "light";
            var lang = "pt";
            try {
                theme = localStorage.getItem("cc-theme") || "light";
                lang = localStorage.getItem("cc-lang") || "pt";
            } catch (e) {
                /* ignore blocked storage; keep defaults */
            }
            if (String(lang).toLowerCase().indexOf("pt") === 0) {
                lang = "pt-PT";
            } else {
                lang = "en";
            }
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("lang", lang);
        })();
    </script>
    <link rel="stylesheet" href="{% static 'products/css/console.css' %}?v=28">
    <link rel="stylesheet" href="{% static 'inventory/css/alerts.css' %}?v=3">
</head>
<body data-side="warehouse" data-list-url="/api/manage/alerts/" data-mark-read-url="/api/manage/alerts/{id}/mark-read/" data-event-mark-read-url="/api/manage/alerts/events/{id}/mark-read/">
    <header class="topbar">
        <div class="topbar-title">
            {% include "products/includes/console_eyebrow.html" %}
            <h1 data-i18n="title">Alerts</h1>
            <p class="alerts-subtitle" data-i18n="subtitle">Receipt discrepancies and dispatch returns</p>
        </div>
        {% include "products/includes/warehouse_page_nav.html" %}
        <div class="topbar-actions">
            {% include "products/includes/account_settings.html" %}
        </div>
    </header>

    <main class="page">
        <p id="banner" class="banner" hidden></p>
        <p id="alerts-empty" class="empty-note" hidden data-i18n="empty">No alerts.</p>
        <div id="alerts-list"></div>
    </main>

    <script src="{% static 'inventory/js/alerts_i18n.js' %}?v=4"></script>
    <script src="{% static 'products/js/console_settings_menu.js' %}?v=4"></script>
    <script src="{% static 'inventory/js/alerts.js' %}?v=3"></script>
</body>
</html>
