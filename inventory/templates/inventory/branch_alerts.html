{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Alerts — CentCompras</title>
    <script>
        (function () {
            var theme = "light";
            var lang = "pt";
            try {
                theme = localStorage.getItem("cc-theme") || "light";
                lang = localStorage.getItem("cc-lang") || "pt";
            } catch (e) {
                /* ignore blocked storage; keep defaults */
            }
            if (String(lang).toLowerCase().indexOf("pt") === 0) {
                lang = "pt-PT";
            } else {
                lang = "en";
            }
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("lang", lang);
        })();
    </script>
    <link rel="stylesheet" href="{% static 'products/css/settings_menu.css' %}?v=5">
    <link rel="stylesheet" href="{% static 'branches/css/branch_chrome.css' %}?v=1">
    <link rel="stylesheet" href="{% static 'inventory/css/alerts.css' %}?v=1">
    {% include "branches/includes/offline_assets.html" %}
</head>
<body
    data-branch-id="{{ branch.id }}"
    data-user-id="{{ user.id }}"
    data-side="branch"
    data-list-url="/api/branch/alerts/"
    data-mark-read-url="/api/branch/alerts/{id}/mark-read/"
>
    {% include "branches/includes/branch_work_page_header.html" %}

    <main class="page alerts-branch-main">
        <p id="banner" class="banner" hidden></p>
        <p id="alerts-empty" class="empty-note" hidden data-i18n="empty">No receipt discrepancies.</p>
        <div class="table-wrap">
            <table class="grid alerts-table">
                <thead>
                    <tr>
                        <th data-i18n="colWhen">When</th>
                        <th data-i18n="colRequest">Request</th>
                        <th data-i18n="colDispatch">Dispatch</th>
                        <th data-i18n="colDiscrepancy">Discrepancy</th>
                        <th data-i18n="colReason">Reason</th>
                        <th data-i18n="colFollowUp">Follow-up request</th>
                    </tr>
                </thead>
                <tbody id="alerts-body"></tbody>
            </table>
        </div>
    </main>

    {% include "branches/includes/offline_scripts.html" %}
    <script src="{% static 'products/js/preferences_bar.js' %}?v=14"></script>
    <script src="{% static 'inventory/js/alerts_i18n.js' %}?v=1"></script>
    <script src="{% static 'inventory/js/alerts.js' %}?v=1"></script>
</body>
</html>
