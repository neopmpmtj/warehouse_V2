{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Alerts — CentCompras</title>
    <script>
        (function () {
            var theme = "light";
            var lang = "pt";
            try {
                theme = localStorage.getItem("cc-theme") || "light";
                lang = localStorage.getItem("cc-lang") || "pt";
            } catch (e) {
                /* ignore blocked storage; keep defaults */
            }
            if (String(lang).toLowerCase().indexOf("pt") === 0) {
                lang = "pt-PT";
            } else {
                lang = "en";
            }
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("lang", lang);
        })();
    </script>
    <link rel="stylesheet" href="{% static 'products/css/settings_menu.css' %}?v=5">
    <link rel="stylesheet" href="{% static 'branches/css/branch_chrome.css' %}?v=1">
    <link rel="stylesheet" href="{% static 'inventory/css/alerts.css' %}?v=3">
    {% include "branches/includes/offline_assets.html" %}
</head>
<body
    data-branch-id="{{ branch.id }}"
    data-user-id="{{ user.id }}"
    data-side="branch"
    data-list-url="/api/branch/alerts/"
    data-mark-read-url="/api/branch/alerts/{id}/mark-read/"
    data-event-mark-read-url="/api/branch/alerts/events/{id}/mark-read/"
>
    {% include "branches/includes/branch_work_page_header.html" %}

    <main class="page alerts-branch-main">
        <p id="banner" class="banner" hidden></p>
        <p id="alerts-empty" class="empty-note" hidden data-i18n="empty">No alerts.</p>
        <div id="alerts-list"></div>
    </main>

    {% include "branches/includes/offline_scripts.html" %}
    <script src="{% static 'products/js/preferences_bar.js' %}?v=18"></script>
    <script src="{% static 'inventory/js/alerts_i18n.js' %}?v=4"></script>
    <script src="{% static 'inventory/js/alerts.js' %}?v=3"></script>
</body>
</html>
