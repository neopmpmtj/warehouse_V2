# CentCompras (warehouse) — nginx site
# Copy to /etc/nginx/sites-available/centcompras and symlink into sites-enabled.
# Replace centcompras.example.com with your real domain.
#
# This file is included from the http {} context, so limit_req_zone is valid here.
# After certbot, a second server { listen 443 ssl; ... } is added; copy proxy
# headers (including X-Forwarded-Host) into that block if certbot does not.

limit_req_zone $binary_remote_addr zone=centcompras_login:10m rate=10r/m;

server {
    listen 80;
    server_name centcompras.example.com;

    client_max_body_size 10M;

    # Static files (collected via manage.py collectstatic)
    location /static/ {
        alias /srv/centcompras/warehouse_V2/staticfiles/;
    }

    location /accounts/login/ {
        limit_req zone=centcompras_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /accounts/google/ {
        limit_req zone=centcompras_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Django via gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
