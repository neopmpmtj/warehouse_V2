# CentCompras (warehouse) — nginx site
# Copy to /etc/nginx/sites-available/centcompras and symlink into sites-enabled.
# Replace centcompras.example.com with your real domain.

server {
    listen 80;
    server_name centcompras.example.com;

    client_max_body_size 10M;

    # Static files (collected via manage.py collectstatic)
    location /static/ {
        alias /srv/centcompras/warehouse_V2/staticfiles/;
    }

    # Django via gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
