{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ branch.name }} — Catalog — CentCompras</title>
    <script>
        (function () {
            var theme = "light";
            var lang = "pt";
            try {
                theme = localStorage.getItem("cc-theme") || "light";
                lang = localStorage.getItem("cc-lang") || "pt";
            } catch (e) {
                /* ignore blocked storage; keep defaults */
            }
            if (String(lang).toLowerCase().indexOf("pt") === 0) {
                lang = "pt-PT";
            } else {
                lang = "en";
            }
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("lang", lang);
        })();
    </script>
    <link rel="stylesheet" href="{% static 'products/css/settings_menu.css' %}?v=5">
    <link rel="stylesheet" href="{% static 'branches/css/branch_chrome.css' %}?v=1">
    <link rel="stylesheet" href="{% static 'branches/css/branch_catalog.css' %}?v=1">
    {% include "branches/includes/offline_assets.html" %}
</head>
<body class="viewport-fill-table" data-branch-id="{{ branch.id }}" data-user-id="{{ user.id }}">
    {% include "branches/includes/branch_work_page_header.html" %}

    <main class="page">
        <section class="toolbar" aria-label="Filters">
            <input type="search" id="catalog-search" data-i18n-placeholder="searchPlaceholder" placeholder="Search code or description…">
            <select id="catalog-family" aria-label="Family filter" data-i18n-aria="familyFilter"></select>
            <select id="catalog-sub-family" aria-label="Sub-family filter" data-i18n-aria="subFamilyFilter"></select>
        </section>

        <p id="offline-banner" class="banner banner-info" hidden></p>
        <p id="banner" class="banner" hidden></p>

        <div class="table-wrap">
            <table class="grid">
                <thead>
                    <tr id="catalog-head">
                        <th class="th-sortable" data-sort="internal_code" data-i18n-col="colCode" aria-sort="none">
                            <button type="button" class="sort-btn">
                                <span data-i18n="colCode">Code</span>
                                <span class="sort-indicator" aria-hidden="true"></span>
                            </button>
                        </th>
                        <th class="th-sortable" data-sort="description" data-i18n-col="colDescription" aria-sort="none">
                            <button type="button" class="sort-btn">
                                <span data-i18n="colDescription">Description</span>
                                <span class="sort-indicator" aria-hidden="true"></span>
                            </button>
                        </th>
                        <th class="th-sortable" data-sort="family" data-i18n-col="colFamily" aria-sort="none">
                            <button type="button" class="sort-btn">
                                <span data-i18n="colFamily">Family</span>
                                <span class="sort-indicator" aria-hidden="true"></span>
                            </button>
                        </th>
                        <th class="th-sortable" data-sort="sub_family" data-i18n-col="colSubFamily" aria-sort="none">
                            <button type="button" class="sort-btn">
                                <span data-i18n="colSubFamily">Sub-family</span>
                                <span class="sort-indicator" aria-hidden="true"></span>
                            </button>
                        </th>
                        <th class="th-sortable" data-sort="unit_of_measure" data-i18n-col="colUnit" aria-sort="none">
                            <button type="button" class="sort-btn">
                                <span data-i18n="colUnit">Unit</span>
                                <span class="sort-indicator" aria-hidden="true"></span>
                            </button>
                        </th>
                        <th class="th-sortable" data-sort="availability" data-i18n-col="colAvailability" aria-sort="none">
                            <button type="button" class="sort-btn">
                                <span data-i18n="colAvailability">Availability</span>
                                <span class="sort-indicator" aria-hidden="true"></span>
                            </button>
                        </th>
                    </tr>
                </thead>
                <tbody id="catalog-body"></tbody>
            </table>
        </div>
        <p id="catalog-empty" class="empty-note" hidden>No items to show.</p>
    </main>

    {% include "branches/includes/offline_scripts.html" %}
    <script src="{% static 'products/js/select_fill.js' %}?v=2"></script>
    <script src="{% static 'branches/js/branch_catalog_i18n.js' %}?v=2"></script>
    <script src="{% static 'branches/js/branch_catalog.js' %}?v=5"></script>
    <script src="{% static 'products/js/preferences_bar.js' %}?v=13"></script>
    <script src="{% static 'products/js/console_settings_menu.js' %}?v=4"></script>
</body>
</html>
