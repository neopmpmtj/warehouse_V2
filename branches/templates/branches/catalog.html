{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ branch.name }} — Catalog — CentCompras</title>
    <script>
        (function () {
            var theme = "light";
            var lang = "en";
            try {
                theme = localStorage.getItem("cc-theme") || "light";
                lang = localStorage.getItem("cc-lang") || "en";
            } catch (e) {
                /* ignore blocked storage; keep defaults */
            }
            if (String(lang).toLowerCase().indexOf("pt") === 0) {
                lang = "pt-PT";
            } else {
                lang = "en";
            }
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("lang", lang);
        })();
    </script>
    <style>
        :root { --none: #b00020; --low: #b26a00; --ok: #1e7d32; }
        main { padding: 20px; }
        .banner { padding: 10px 14px; border-radius: 4px; background: #fdecea; color: #b00020; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border, #ddd); }
        th { color: var(--muted, #666); font-weight: 600; font-size: .85rem; }
        .avail-none { color: var(--none); font-weight: 600; }
        .avail-low { color: var(--low); font-weight: 600; }
        .avail-ok { color: var(--ok); font-weight: 600; }
        .empty { color: var(--muted, #666); }
    </style>
    <link rel="stylesheet" href="{% static 'products/css/settings_menu.css' %}?v=4">
    <link rel="stylesheet" href="{% static 'branches/css/branch_chrome.css' %}?v=1">
</head>
<body>
    {% include "branches/includes/branch_page_header.html" %}

    <main>
        <p id="banner" class="banner" hidden></p>
        <table>
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Description</th>
                    <th>Family</th>
                    <th>Sub-family</th>
                    <th>Unit</th>
                    <th>Retail</th>
                    <th>Wholesale</th>
                    <th>Special</th>
                    <th>Availability</th>
                </tr>
            </thead>
            <tbody id="catalog-body"></tbody>
        </table>
        <p id="empty" class="empty" hidden>No items to show.</p>
    </main>

    <script>
        (function () {
            var body = document.getElementById("catalog-body");
            var empty = document.getElementById("empty");
            var banner = document.getElementById("banner");
            var AVAIL = { none: "None", low: "Low", "in stock": "In stock" };
            var AVAIL_CLASS = { none: "avail-none", low: "avail-low", "in stock": "avail-ok" };

            function cell(text, className) {
                var td = document.createElement("td");
                td.textContent = text == null ? "" : text;
                if (className) td.className = className;
                return td;
            }

            function render(rows) {
                body.textContent = "";
                rows.forEach(function (row) {
                    var tr = document.createElement("tr");
                    tr.appendChild(cell(row.internal_code));
                    tr.appendChild(cell(row.description));
                    tr.appendChild(cell(row.family));
                    tr.appendChild(cell(row.sub_family));
                    tr.appendChild(cell(row.unit_of_measure));
                    tr.appendChild(cell(row.retail_price));
                    tr.appendChild(cell(row.wholesale_price));
                    tr.appendChild(cell(row.special_price));
                    tr.appendChild(cell(AVAIL[row.availability] || row.availability, AVAIL_CLASS[row.availability]));
                    body.appendChild(tr);
                });
                empty.hidden = rows.length !== 0;
            }

            fetch("/api/branch/catalog/", { headers: { "Accept": "application/json" } })
                .then(function (resp) {
                    if (!resp.ok) {
                        return resp.json().then(function (data) {
                            throw new Error(data.error || ("HTTP " + resp.status));
                        });
                    }
                    return resp.json();
                })
                .then(function (data) { render(data.catalog || []); })
                .catch(function (err) {
                    banner.textContent = err.message || "Failed to load catalog.";
                    banner.hidden = false;
                    empty.hidden = true;
                });
        })();
    </script>
    <script src="{% static 'products/js/preferences_bar.js' %}?v=5"></script>
    <script src="{% static 'products/js/console_settings_menu.js' %}"></script>
</body>
</html>
