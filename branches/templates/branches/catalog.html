{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ branch.name }} — Catalog — CentCompras</title>
    <script>
        (function () {
            var theme = "light";
            var lang = "en";
            try {
                theme = localStorage.getItem("cc-theme") || "light";
                lang = localStorage.getItem("cc-lang") || "en";
            } catch (e) {
                /* ignore blocked storage; keep defaults */
            }
            if (String(lang).toLowerCase().indexOf("pt") === 0) {
                lang = "pt-PT";
            } else {
                lang = "en";
            }
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("lang", lang);
        })();
    </script>
    <style>
        :root { --none: #b00020; --low: #b26a00; --ok: #1e7d32; }
        main { padding: 20px; }
        .banner { padding: 10px 14px; border-radius: 4px; background: #fdecea; color: #b00020; }
        .banner-info { background: #e8f0fe; color: #0b57d0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border, #ddd); }
        th { color: var(--muted, #666); font-weight: 600; font-size: .85rem; }
        .avail-none { color: var(--none); font-weight: 600; }
        .avail-low { color: var(--low); font-weight: 600; }
        .avail-ok { color: var(--ok); font-weight: 600; }
        .empty { color: var(--muted, #666); }
    </style>
    <link rel="stylesheet" href="{% static 'products/css/settings_menu.css' %}?v=5">
    <link rel="stylesheet" href="{% static 'branches/css/branch_chrome.css' %}?v=1">
    {% include "branches/includes/offline_assets.html" %}
</head>
<body data-branch-id="{{ branch.id }}" data-user-id="{{ user.id }}">
    {% include "branches/includes/branch_work_page_header.html" %}

    <main>
        <p id="offline-banner" class="banner banner-info" hidden></p>
        <p id="banner" class="banner" hidden></p>
        <table>
            <thead>
                <tr id="catalog-head"></tr>
            </thead>
            <tbody id="catalog-body"></tbody>
        </table>
        <p id="empty" class="empty" hidden>No items to show.</p>
    </main>

    {% include "branches/includes/offline_scripts.html" %}
    <script src="{% static 'branches/js/branch_catalog.js' %}?v=4"></script>
    <script src="{% static 'products/js/preferences_bar.js' %}?v=9"></script>
    <script src="{% static 'products/js/console_settings_menu.js' %}?v=3"></script>
</body>
</html>
