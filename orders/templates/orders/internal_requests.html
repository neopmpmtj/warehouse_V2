{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Internal requests — CentCompras</title>
    <style>
        :root { --border: #ddd; --muted: #666; --brand: #0b57d0; }
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; color: #222; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); }
        header h1 { font-size: 1.2rem; margin: 0; }
        header .user { color: var(--muted); font-size: .9rem; }
        header a, header button { margin-left: 12px; color: var(--brand); text-decoration: none; }
        header form { display: inline; }
        header button { background: none; border: none; cursor: pointer; font: inherit; padding: 0; }
        main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px; }
        @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
        .panel { border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
        h2 { margin: 0 0 10px; font-size: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; font-size: .8rem; }
        .btn { border: 1px solid var(--border); background: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
        .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
        .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
        input { border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font: inherit; }
        .qty { width: 70px; }
        .banner { padding: 8px 12px; border-radius: 4px; background: #fdecea; color: #b00020; margin-top: 10px; }
        .selected { background: #eef4fe; }
    </style>
    <link rel="stylesheet" href="{% static 'products/css/settings_menu.css' %}?v=2">
</head>
<body>
    <header>
        <h1>Internal requests</h1>
        <div class="header-actions">
            <a href="{% url 'branch_approval_limit_console' %}">Branch caps</a>
            {% include "products/includes/account_settings.html" %}
        </div>
    </header>

    <main>
        <section class="panel">
            <h2>Queue (approved / fulfilling)</h2>
            <table>
                <thead><tr><th>#</th><th>Branch</th><th>Status</th><th>Gross</th></tr></thead>
                <tbody id="request-body"></tbody>
            </table>
        </section>

        <section class="panel">
            <h2 id="detail-title">Request</h2>
            <p id="detail-meta" style="color:var(--muted);margin:0 0 10px;"></p>
            <table>
                <thead><tr><th>Code</th><th>Description</th><th>Qty</th><th>Issued</th><th>Remaining</th><th>Reserved</th><th>Backorder</th><th>On hand</th><th>Available</th><th>Issue qty</th></tr></thead>
                <tbody id="line-body"></tbody>
            </table>
            <div class="row">
                <input id="issue-reference" placeholder="Reference (guia)">
                <input id="issue-notes" placeholder="Notes">
                <button id="issue-btn" class="btn btn-primary">Issue</button>
                <button id="short-close-btn" class="btn">Short close</button>
            </div>
            <p id="banner" class="banner" hidden></p>
        </section>
    </main>

    <script>
        (function () {
            var CSRF = document.querySelector('meta[name="csrf-token"]').content;
            var CAN_ISSUE = {{ can_issue|yesno:"true,false" }};
            var CAN_SHORT_CLOSE = {{ can_short_close|yesno:"true,false" }};
            var state = { selectedId: null, requests: [] };

            var requestBody = document.getElementById("request-body");
            var lineBody = document.getElementById("line-body");
            var banner = document.getElementById("banner");
            var detailTitle = document.getElementById("detail-title");
            var detailMeta = document.getElementById("detail-meta");

            function el(tag, text, cls) { var n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; }
            function showError(m) { banner.textContent = m || "Request failed."; banner.hidden = false; }
            function clearError() { banner.hidden = true; }

            function api(path, method, body) {
                var opts = { method: method || "GET", headers: { "Accept": "application/json", "X-CSRFToken": CSRF } };
                if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
                return fetch(path, opts).then(function (r) {
                    return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || ("HTTP " + r.status)); return d; });
                });
            }

            function renderList() {
                requestBody.textContent = "";
                state.requests.forEach(function (req) {
                    var tr = document.createElement("tr");
                    if (req.id === state.selectedId) tr.className = "selected";
                    tr.appendChild(el("td", req.id));
                    tr.appendChild(el("td", req.branch_name));
                    tr.appendChild(el("td", req.status));
                    tr.appendChild(el("td", req.approved_gross));
                    tr.addEventListener("click", function () { select(req.id); });
                    requestBody.appendChild(tr);
                });
            }

            function load() {
                return api("/api/manage/internal-requests/").then(function (d) {
                    state.requests = d.requests || [];
                    renderList();
                });
            }

            function renderDetail(req) {
                detailTitle.textContent = "Request #" + req.id + " — " + req.branch_name;
                detailMeta.textContent = "Status " + req.status + " · gross " + req.approved_gross;
                lineBody.textContent = "";
                req.lines.forEach(function (line) {
                    var tr = document.createElement("tr");
                    tr.appendChild(el("td", line.internal_code));
                    tr.appendChild(el("td", line.description));
                    tr.appendChild(el("td", line.quantity));
                    tr.appendChild(el("td", line.issued));
                    tr.appendChild(el("td", line.remaining));
                    tr.appendChild(el("td", line.reserved));
                    tr.appendChild(el("td", line.backorder));
                    tr.appendChild(el("td", line.on_hand));
                    tr.appendChild(el("td", line.available));
                    var td = document.createElement("td");
                    var input = document.createElement("input");
                    input.type = "number"; input.step = "0.001"; input.min = "0.001"; input.className = "qty";
                    input.dataset.lineId = line.line_id;
                    if (line.reserved && Number(line.reserved) > 0) {
                        input.value = line.reserved;
                        input.max = line.reserved;
                    }
                    input.disabled = !CAN_ISSUE || req.status === "shipped";
                    td.appendChild(input);
                    tr.appendChild(td);
                    lineBody.appendChild(tr);
                });
            }

            function select(id) {
                state.selectedId = id;
                clearError();
                api("/api/manage/internal-requests/" + id + "/").then(function (d) {
                    renderDetail(d.request);
                    renderList();
                }).catch(showError);
            }

            function issue() {
                clearError();
                var lines = [];
                lineBody.querySelectorAll("input[data-line-id]").forEach(function (input) {
                    if (input.value) lines.push({ line_id: parseInt(input.dataset.lineId, 10), quantity_issued: input.value });
                });
                if (!lines.length) { showError("Enter at least one issue quantity."); return; }
                api("/api/manage/internal-requests/" + state.selectedId + "/issue/", "POST", {
                    lines: lines,
                    reference: document.getElementById("issue-reference").value,
                    notes: document.getElementById("issue-notes").value
                }).then(function () { return load().then(function () { select(state.selectedId); }); }).catch(showError);
            }

            function shortClose() {
                clearError();
                var reason = prompt("Reason for short-close:");
                if (reason === null) return;
                api("/api/manage/internal-requests/" + state.selectedId + "/short-close/", "POST", { reason: reason })
                    .then(function () { return load().then(function () { select(state.selectedId); }); }).catch(showError);
            }

            document.getElementById("issue-btn").addEventListener("click", issue);
            document.getElementById("short-close-btn").addEventListener("click", shortClose);
            document.getElementById("short-close-btn").disabled = !CAN_SHORT_CLOSE;

            load().catch(showError);
        })();
    </script>
    <script src="{% static 'products/js/console_settings_menu.js' %}"></script>
</body>
</html>
