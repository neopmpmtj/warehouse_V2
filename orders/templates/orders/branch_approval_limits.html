{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Branch approval limits — CentCompras</title>
    <script>
        (function () {
            var theme = "light";
            try {
                theme = localStorage.getItem("cc-theme") || "light";
            } catch (e) {
                /* ignore */
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="{% static 'products/css/console.css' %}?v=19">
</head>
<body>
    <header class="topbar">
        <div class="topbar-title">
            {% include "products/includes/console_eyebrow.html" %}
            <h1>Branch approval limits</h1>
        </div>
        {% include "products/includes/warehouse_page_nav.html" %}
        <div class="topbar-actions">
            {% include "products/includes/account_settings.html" %}
        </div>
    </header>

    <main class="page">
        <section class="console-panel console-panel-narrow">
            <h2 class="panel-heading">Manager caps (EUR gross)</h2>
            <div class="form-row"><span class="form-row-label">Others:</span><input id="approval-limit" type="number" step="0.01" min="0"></div>
            <div class="form-row"><span class="form-row-label">Self:</span><input id="self-approval-limit" type="number" step="0.01" min="0"></div>
            <div class="form-row"><button id="save" class="btn btn-primary">Save</button></div>
            <p id="banner" class="banner-inline" hidden></p>
            <p id="ok" class="banner-inline ok" hidden>Saved.</p>
        </section>
    </main>

    <script>
        (function () {
            var CSRF = document.querySelector('meta[name="csrf-token"]').content;
            var CAN_EDIT = {{ can_edit_approval_policy|yesno:"true,false" }};
            var state = { id: null };

            var approvalInput = document.getElementById("approval-limit");
            var selfInput = document.getElementById("self-approval-limit");
            var banner = document.getElementById("banner");
            var ok = document.getElementById("ok");

            function api(path, method, body) {
                var opts = { method: method || "GET", headers: { "Accept": "application/json", "X-CSRFToken": CSRF } };
                if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
                return fetch(path, opts).then(function (r) {
                    return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || ("HTTP " + r.status)); return d; });
                });
            }

            api("/api/manage/branch-approval-limits/").then(function (d) {
                var limits = d.branch_approval_limits || [];
                if (limits.length) {
                    state.id = limits[0].id;
                    approvalInput.value = limits[0].approval_limit;
                    selfInput.value = limits[0].self_approval_limit;
                }
                approvalInput.disabled = !CAN_EDIT;
                selfInput.disabled = !CAN_EDIT;
                document.getElementById("save").disabled = !CAN_EDIT;
            }).catch(function (e) { banner.textContent = e.message; banner.hidden = false; });

            document.getElementById("save").addEventListener("click", function () {
                banner.hidden = true; ok.hidden = true;
                api("/api/manage/branch-approval-limits/", "PATCH", {
                    id: state.id,
                    approval_limit: approvalInput.value,
                    self_approval_limit: selfInput.value
                }).then(function (d) {
                    approvalInput.value = d.branch_approval_limit.approval_limit;
                    selfInput.value = d.branch_approval_limit.self_approval_limit;
                    ok.hidden = false;
                }).catch(function (e) { banner.textContent = e.message; banner.hidden = false; });
            });
        })();
    </script>
    <script src="{% static 'products/js/preferences_bar.js' %}?v=9"></script>
    <script src="{% static 'products/js/console_settings_menu.js' %}?v=3"></script>
</body>
</html>
