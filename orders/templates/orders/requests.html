{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Requisição interna — CentCompras</title>
    <style>
        :root { --border: #ddd; --muted: #666; --brand: #0b57d0; }
        main { display: grid; grid-template-columns: 360px 1fr; gap: 20px; padding: 20px; }
        @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
        .panel { border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
        h2 { margin: 0 0 10px; font-size: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; font-size: .8rem; }
        .btn { border: 1px solid var(--border); background: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
        .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
        .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
        input, select { border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font: inherit; }
        .banner { padding: 8px 12px; border-radius: 4px; background: #fdecea; color: #b00020; margin-top: 10px; }
        .banner-info { background: #e8f0fe; color: #0b57d0; }
        .status { text-transform: capitalize; font-weight: 600; }
        .selected { background: #eef4fe; }
    </style>
    <link rel="stylesheet" href="{% static 'products/css/settings_menu.css' %}?v=5">
    <link rel="stylesheet" href="{% static 'branches/css/branch_chrome.css' %}?v=1">
    {% include "branches/includes/offline_assets.html" %}
</head>
<body data-branch-id="{{ branch.id }}" data-user-id="{{ user.id }}" data-can-approve="{{ can_approve|yesno:'true,false' }}">
    {% include "branches/includes/branch_work_page_header.html" %}

    <main>
        <section class="panel">
            <h2>Requests</h2>
            <p id="offline-banner" class="banner banner-info" hidden></p>
            <div class="row">
                <button id="new-request" class="btn btn-primary">New request</button>
            </div>
            <table>
                <thead><tr><th>#</th><th>Status</th><th>Created</th></tr></thead>
                <tbody id="request-body"></tbody>
            </table>
        </section>

        <section class="panel">
            <h2 id="detail-title">Request</h2>
            <p id="detail-meta" style="color:var(--muted);margin:0 0 6px;"></p>
            <p id="detail-totals" style="margin:0 0 10px;"></p>

            <table>
                <thead><tr id="line-head"></tr></thead>
                <tbody id="line-body"></tbody>
            </table>

            <div id="line-form" class="row" hidden>
                <select id="line-item" style="flex:1;"></select>
                <input id="line-qty" type="number" step="0.001" min="0.001" placeholder="Qty" style="width:90px;">
                <button id="add-line" class="btn">Add</button>
            </div>

            <div id="actions" class="row" hidden></div>

            <p id="banner" class="banner" hidden></p>
        </section>
    </main>

    {% include "branches/includes/offline_scripts.html" %}
    <script src="{% static 'orders/js/branch_requests.js' %}?v=5"></script>
    <script src="{% static 'products/js/preferences_bar.js' %}?v=9"></script>
    <script src="{% static 'products/js/console_settings_menu.js' %}?v=3"></script>
</body>
</html>
