<div class="preferences-bar" role="group" aria-label="Preferences">
    <label class="pref-control" for="pref-language">
        <span data-i18n="language">Language</span>
        <select id="pref-language" aria-label="Language">
            <option value="en">English</option>
            <option value="pt">Português</option>
        </select>
    </label>
    <button type="button" id="pref-theme" class="btn btn-ghost" data-i18n-aria="themeDark"></button>
</div>
