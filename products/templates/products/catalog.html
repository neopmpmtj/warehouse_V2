{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Manager catalog — CentCompras</title>
    <script>
        (function () {
            var theme = "light";
            var lang = "en";
            try {
                theme = localStorage.getItem("cc-theme") || "light";
                lang = localStorage.getItem("cc-lang") || "en";
            } catch (e) {
                /* ignore blocked storage; keep defaults */
            }
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("lang", lang);
        })();
    </script>
    <link rel="stylesheet" href="{% static 'products/css/console.css' %}?v=13">
    <link rel="stylesheet" href="{% static 'products/css/catalog.css' %}?v=1">
</head>
<body>
    <header class="topbar">
        <div class="topbar-title">
            <p class="eyebrow" data-i18n="eyebrow">CentCompras</p>
            <h1 data-i18n="title">Manager catalog</h1>
        </div>
        <div class="topbar-actions">
            <div class="settings-menu">
                <button
                    type="button"
                    id="settings-toggle"
                    class="btn btn-ghost settings-toggle"
                    aria-expanded="false"
                    aria-controls="settings-popover"
                    aria-haspopup="true"
                    data-i18n-aria="settings"
                >
                    <svg class="settings-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.64l-1.92-3.32a.49.49 0 0 0-.61-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.49.49 0 0 0-.48-.41h-3.84a.49.49 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.61.22L2.74 8.87a.49.49 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.64l1.92 3.32c.14.24.43.34.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.18.12.47.02.61-.22l1.92-3.32a.49.49 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
                    </svg>
                </button>
                <div id="settings-popover" class="settings-popover" hidden role="dialog" aria-labelledby="settings-popover-title">
                    <p id="settings-popover-title" class="settings-popover-title" data-i18n="settings">Settings</p>
                    <p class="user-line">
                        <span data-i18n="signedInAs">Signed in as</span>
                        <strong>{{ user.email }}</strong>
                    </p>
                    <label class="control-inline">
                        <span data-i18n="language">Language</span>
                        <select id="language-select" aria-label="Language">
                            <option value="en">English</option>
                            <option value="pt-PT">Português</option>
                        </select>
                    </label>
                    <button type="button" id="theme-toggle" class="btn btn-ghost"></button>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-ghost" data-i18n="signOut">Sign out</button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <main class="page">
        <section class="toolbar" aria-label="Filters">
            <input type="search" id="catalog-search" data-i18n-placeholder="searchPlaceholder" placeholder="Search code or description…">
            <select id="catalog-family" aria-label="Family filter"></select>
            <label class="control-inline">
                <input type="checkbox" id="catalog-below-reorder">
                <span data-i18n="belowReorderOnly">Below reorder only</span>
            </label>
            <div class="toolbar-spacer"></div>
        </section>

        <p id="banner" class="banner" hidden></p>

        <div class="table-wrap">
            <table class="grid">
                <thead>
                    <tr>
                        <th data-i18n="colCode">Code</th>
                        <th data-i18n="colDescription">Description</th>
                        <th data-i18n="colFamily">Family</th>
                        <th data-i18n="colUnit">Unit</th>
                        <th data-i18n="colStock">Stock</th>
                        <th data-i18n="colReorder">Reorder</th>
                        <th data-i18n="colBuying">Buying</th>
                        <th data-i18n="colRetail">Retail</th>
                        <th data-i18n="colWholesale">Wholesale</th>
                        <th data-i18n="colSpecial">Special</th>
                        <th data-i18n="colSuppliers">Suppliers</th>
                        <th data-i18n="colStatus">Status</th>
                    </tr>
                </thead>
                <tbody id="catalog-body"></tbody>
            </table>
        </div>
        <p id="catalog-empty" class="empty-note" hidden data-i18n="empty">No items to show.</p>
    </main>

    <script src="{% static 'products/js/catalog_i18n.js' %}?v=2"></script>
    <script src="{% static 'products/js/console_settings_menu.js' %}?v=1"></script>
    <script src="{% static 'products/js/catalog.js' %}?v=2"></script>
</body>
</html>
